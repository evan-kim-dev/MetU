name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # VERIFY: lockfile optional (@emnapi via sharp-wasm32) can desync across OS; match Vercel installCommand.
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-only
      INTERNAL_API_SECRET: ci-build-dummy
      GUEST_COOKIE_SECRET: ci-build-dummy
      GEMINI_API_KEY: ci-build-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build
